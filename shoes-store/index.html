<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shoes Store</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="#" class="nav-logo">SHOES Name</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Store</a></li>
                <li class="nav-item"><a href="#" class="nav-link">About</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
            </ul>
            <div class="nav-icons">
                <a href="#"><i class="fas fa-search"></i></a>
                <a href="#"><i class="fas fa-shopping-cart"></i></a>
                <a href="#"><i class="fas fa-user"></i></a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="mySlides">
                <div class="numbertext">1 / 4</div>
                <img src="assets/pexels-chipi1189-35618113.webp" style="width:100%">
            </div>

            <div class="mySlides">
                <div class="numbertext">2 / 4</div>
                <img src="assets/pexels-indigentesce-8979069.webp" style="width:100%">
            </div>

            <div class="mySlides">
                <div class="numbertext">3 / 4</div>
                <img src="assets/pexels-pedrofurtadoo-29096401.webp" style="width:100%">
            </div>
                
            <div class="mySlides">
                <div class="numbertext">4 / 4</div>
                <img src="assets/pexels-zeleboba-26893166.webp" style="width:100%">
            </div>
                
            <a class="prev" onclick="plusSlides(-1)">❮</a>
            <a class="next" onclick="plusSlides(1)">❯</a>

            <div class="caption">
                <p id="caption"></p>
            </div>

            <div class="row">
                <div class="column">
                    <img class="action cursor" src="assets/pexels-chipi1189-35618113.webp" style="width:100%" onclick="currentSlide(1)" alt="Red One">
                </div>
                <div class="column">
                    <img class="action cursor" src="assets/pexels-indigentesce-8979069.webp" style="width:100%" onclick="currentSlide(2)" alt="White One">
                </div>
                <div class="column">
                    <img class="action cursor" src="assets/pexels-pedrofurtadoo-29096401.webp" style="width:100%" onclick="currentSlide(3)" alt="Black One">
                </div>
                <div class="column">
                    <img class="action cursor" src="assets/pexels-zeleboba-26893166.webp" style="width:100%" onclick="currentSlide(4)" alt="Black-White One">
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 SHOES Store. All rights reserved.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-4.0.0.slim.js" integrity="sha256-M+GjhMBfXikM1izMplICCTscIj5hzPCp6uDzaypxtgg=" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>
</html>
