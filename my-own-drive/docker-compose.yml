services:
  web:
    build: .
    container_name: my-own-drive-web
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # keep the container's installed node_modules, don't shadow with host's
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    stdin_open: true
    tty: true